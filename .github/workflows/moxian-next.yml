name: Verify Moxian Next

on:
  push:
    paths:
      - 'moxian-next/**'
      - '.github/workflows/moxian-next.yml'
  pull_request:
    paths:
      - 'moxian-next/**'
      - '.github/workflows/moxian-next.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moxian-next
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: python -m pip install .
      - run: SDD_INSTALLED_CLI="$(command -v sdd)" python -m unittest discover -s tests -v
      - name: Verify installed content outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          sdd workflow
          for slug in $(sdd roles | cut -f1); do sdd role "$slug" >/dev/null; done
      - name: Check rolling migration with SQLite
        working-directory: moxian-next/examples/sqlite-migration
        run: python -m unittest -v

  reservation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify all four cancellation boundaries
        working-directory: moxian-next/examples/reservations
        env:
          PYTHONPATH: ${{ github.workspace }}/moxian-next
        shell: bash
        run: |
          python3 -m sdd test-go --package example.org/reservations \
            --test TestCancellationBoundary/more_than_one_day \
            --test TestCancellationBoundary/exactly_one_day \
            --test TestCancellationBoundary/under_one_day \
            --test TestCancellationBoundary/already_started -- ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moxian-next/examples/web-preferences
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - run: npm ci
      - run: npm exec -- vitest run tests/unit
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm exec -- playwright test
